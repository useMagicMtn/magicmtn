[package]
name = "magicmtn-local"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Single-user local assembly of the MagicMtn engine"

[dependencies]
base64 = "0.22"
magicmtn-web-ui = { path = "../web-ui" }
magicmtn-sdk = { path = "../sdk/rust/magicmtn-sdk" }
magicmtn-engine = { path = "../core", features = ["sqlite"] }
magicmtn-provider-framework = { path = "../sdk/rust/magicmtn-provider-framework", features = ["host"] }
anyhow = "1"
axum = "0.7.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "migrate"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
ring = "0.17"
zeroize = "1.8"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
sha2 = "0.10"
tracing-subscriber = "0.3"
tracing = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
