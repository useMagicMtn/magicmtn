name: Publish CLI binaries

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [stable]
        default: stable
        required: true

permissions:
  contents: read

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cli-release-checks.yml

  canonical:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify the committed Canonical release
        run: python3 scripts/publish-canonical-image.py --verify-lock

  linux:
    needs: [checks, canonical]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: sh scripts/package-cli-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-linux
          path: dist/bin/magic-linux-*
          if-no-files-found: error
          retention-days: 14

  linux-compatibility:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-linux
          path: dist/bin
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: chmod +x dist/bin/magic-linux-* && sh scripts/check-cli-linux.sh --native

  publish:
    needs: [checks, linux-compatibility]
    runs-on: macos-15
    timeout-minutes: 45
    environment: cli-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-linux
          path: dist/bin
      - run: rustup toolchain install
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.CLI_RELEASE_AWS_ROLE_ARN }}
          aws-region: us-east-2
      - run: sh scripts/package-cli.sh
      - name: Publish binaries and checksums
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          cp dist/bin/magic dist/bin/magic-darwin-arm64
          python3 scripts/publish-cli.py --skip-build --channel "$RELEASE_CHANNEL"
          cp sdk/rust/magicmtn-sdk/src/canonical-image.json dist/public-release/canonical-image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cli-release-receipt
          path: dist/public-release/
          if-no-files-found: ignore
          retention-days: 14
