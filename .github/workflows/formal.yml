name: Formal verification

on:
  pull_request:
    paths:
      - 'formal/**'
      - 'sdk/rust/magicmtn-provider-framework/src/host/credentials.rs'
      - 'core/src/provider_credentials.rs'
      - 'scripts/check-sandbox-lifecycle.py'
      - 'scripts/formal_model.py'
      - 'scripts/check-credential-vault.py'
      - 'scripts/check-provider-credentials.py'
      - 'core/src/sandbox_lifecycle.rs'
      - 'core/src/credential_vault/**'
      - 'core/migrations/010_sandbox_lifecycle.sql'
      - 'core/migrations/*credential_vault*.sql'
      - '.github/workflows/formal.yml'
  push:
    paths:
      - 'formal/**'
      - 'sdk/rust/magicmtn-provider-framework/src/host/credentials.rs'
      - 'core/src/provider_credentials.rs'
      - 'scripts/check-sandbox-lifecycle.py'
      - 'scripts/formal_model.py'
      - 'scripts/check-credential-vault.py'
      - 'scripts/check-provider-credentials.py'
      - 'core/src/sandbox_lifecycle.rs'
      - 'core/src/credential_vault/**'
      - 'core/migrations/010_sandbox_lifecycle.sql'
      - 'core/migrations/*credential_vault*.sql'
      - '.github/workflows/formal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-sandbox-lifecycle.py --mutation-checks
      - run: python3 scripts/check-credential-vault.py --mutation-checks
      - run: python3 scripts/check-provider-credentials.py --mutation-checks
