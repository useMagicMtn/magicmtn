name: CLI release verification

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - 'rust-toolchain.toml'
      - 'Containerfile'
      - 'images/cli.Containerfile'
      - 'cli/**'
      - 'interfaces/pi/**'
      - 'interfaces/opencode/**'
      - 'core/**'
      - 'local/**'
      - 'web-ui/**'
      - 'sdk/rust/**'
      - 'images/canonical/**'
      - 'scripts/*canonical*'
      - '.github/workflows/canonical-image.yml'
      - 'release/**'
      - 'scripts/*cli*'
      - 'scripts/install-public.sh'
      - 'scripts/install-checksum.sh'
      - 'scripts/test-install-public.sh'
      - 'tests/fixtures/cli-release/**'
      - 'server/src/cli_installer.rs'
      - 'server/src/authentication.rs'
      - 'server/tests/cli_installer.rs'
      - '.github/workflows/cli-release*.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - 'rust-toolchain.toml'
      - 'Containerfile'
      - 'images/cli.Containerfile'
      - 'cli/**'
      - 'interfaces/pi/**'
      - 'interfaces/opencode/**'
      - 'core/**'
      - 'local/**'
      - 'web-ui/**'
      - 'sdk/rust/**'
      - 'images/canonical/**'
      - 'scripts/*canonical*'
      - '.github/workflows/canonical-image.yml'
      - 'release/**'
      - 'scripts/*cli*'
      - 'scripts/install-public.sh'
      - 'scripts/install-checksum.sh'
      - 'scripts/test-install-public.sh'
      - 'tests/fixtures/cli-release/**'
      - 'server/src/cli_installer.rs'
      - 'server/src/authentication.rs'
      - 'server/tests/cli_installer.rs'
      - '.github/workflows/cli-release*.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --prefix interfaces/pi --ignore-scripts --no-audit --no-fund
      - run: npm --prefix interfaces/pi test
      - run: python3 -m unittest discover -s local/runtime -p "test_*.py"
      - run: rustup toolchain install
      - run: python3 -m unittest discover -s scripts -p 'test_cli*.py'
      - run: python3 -m unittest discover -s scripts -p test_canonical_image_release.py
      - run: cargo test --locked -p magicmtn-cli -p magicmtn-local -p magicmtn-engine --lib --bins --tests -- --test-threads=1
      - name: Verify local terminal handoff
        env:
          MAGICMTN_TEST_MAGIC: ${{ github.workspace }}/target/debug/magic
        run: python3 -m unittest discover -s cli/tests -p test_local_terminal.py
      - name: Verify terminal streams through HTTPS ingress
        env:
          MAGICMTN_TEST_MAGIC: ${{ github.workspace }}/target/debug/magic
        run: |
          sudo apt-get update && sudo apt-get install -y caddy openssl
          python3 -m venv "$RUNNER_TEMP/terminal-tests"
          "$RUNNER_TEMP/terminal-tests/bin/pip" install -r runtime/requirements.txt
          "$RUNNER_TEMP/terminal-tests/bin/python" -m unittest discover -s cli/tests -p test_pi_stream.py
