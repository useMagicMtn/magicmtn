[package]
name = "magicmtn-cli"
version = "1.1.0"
edition = "2021"
rust-version = "1.100"
license = "Apache-2.0"
publish = false
description = "Command-line client for MagicMtn resources"
default-run = "magic"

[[bin]]
name = "magic"
path = "src/main.rs"

[features]
development-server = []

[dependencies]
magicmtn-local = { path = "../local" }
magicmtn-provider-framework = { path = "../sdk/rust/magicmtn-provider-framework", features = ["host"] }
magicmtn-sdk = { path = "../sdk/rust/magicmtn-sdk" }
anyhow = "1"
clap = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = "=4.5.42"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
flate2 = "1"
tar = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
tempfile = "3"
base64 = "0.22"
ring = "0.17.14"
crossterm = "0.29"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
sentry = { version = "0.49.3", default-features = false, features = ["ureq", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
axum = "0.7"
